<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selar Merchant International Portal</title>
    <style>
        /* --- GLOBAL RESETS --- */
        :root { --airtel-red: #ff0000; --selar-blue: #002d5b; --bg-soft: #f4f7f9; --gold: #ffb400; --glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .mobile-container { width: 100%; max-width: 400px; background: white; min-height: 100vh; position: relative; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* --- WELCOME E-WALLET SCREEN --- */
        #welcome-view { background: #1976d2; color: white; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .e-logo { font-size: 80px; margin-bottom: 20px; }
        .e-title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .e-subtitle { font-size: 0.9rem; opacity: 0.9; margin-bottom: 40px; }
        .btn-group { display: flex; gap: 15px; width: 100%; }
        .btn-welcome { flex: 1; padding: 15px; border-radius: 8px; border: 2px solid white; background: transparent; color: white; font-weight: bold; cursor: pointer; }
        .btn-welcome.solid { background: white; color: #1976d2; }

        /* --- LOGIN & DASHBOARD (Rest of the app) --- */
        #login-view { background-color: var(--bg-soft); min-height: 100vh; }
        .intl-header-box { font-size: 0.62rem; color: #666; text-align: right; padding: 12px; border-bottom: 1px solid #eee; background: white; }
        .login-hero { text-align: center; padding: 30px 20px; }
        .airtel-logo-red { color: var(--airtel-red); font-size: 2.8rem; font-weight: 800; }
        .login-card { margin: 0 20px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .login-card label { display: block; font-size: 0.7rem; font-weight: 700; color: #999; margin-bottom: 5px; }
        .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1.5px solid #f0f0f0; }
        .btn-access { width: 100%; padding: 16px; background: var(--airtel-red); color: white; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; }
        
        /* [Include your previous Dashboard and Overlay CSS here...] */
        .dash-header { background: var(--selar-blue); color: white; padding: 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }
        .balance-section { background: white; margin: -20px 20px 0; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
        .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 25px 20px; }
        .service-item { text-align: center; cursor: pointer; }
        .icon-circ { width: 55px; height: 55px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; }
        .bg-transfer { background: #e3f2fd; color: #1976d2; } .bg-withdraw { background: #fff3e0; color: #f57c00; } 
        .bg-bills { background: #fce4ec; color: #d81b60; } .bg-browser { background: #e8f5e9; color: #388e3c; }  
        .bg-special { background: #f3e5f5; color: #7b1fa2; } .bg-rates { background: #fffde7; color: #fbc02d; }    
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .notif-card { background: var(--glass); border-radius: 25px; padding: 25px; border: 2px solid var(--airtel-red); width: 100%; text-align: center; }
        .btn-ok { background: var(--airtel-red); color: white; border: none; padding: 12px 30px; border-radius: 20px; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--airtel-red); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="welcome-view">
        <div class="e-logo">▲</div>
        <div class="e-title">E-Wallet</div>
        <p class="e-subtitle">Manage all your cards easily in one place</p>
        <div class="btn-group">
            <button class="btn-welcome" onclick="showLogin()">Register</button>
            <button class="btn-welcome solid" onclick="showLogin()">Sign in</button>
        </div>
    </div>

    <div id="login-view" class="hidden">
        <div class="intl-header-box"><b>Selar Merchant Invoice International</b></div>
        <div class="login-hero">
            <div class="airtel-logo-red">Selar/airtel</div>
        </div>
        <div class="login-card">
            <label>Full Name</label>
            <input type="text" id="m-name" placeholder="Enter Full Name">
            <label>Phone Number</label>
            <input type="text" id="m-phone" placeholder="Enter Phone Number">
            <label>Create Merchant Password</label>
            <input type="password" id="m-pin" placeholder="••••••••">
            <button class="btn-access" onclick="startVerification()">Access Dashboard</button>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        </div>
</div>

<script>
    function showLogin() {
        document.getElementById('welcome-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
    }
    
    // Existing functions (startVerification, launchDashDirectly, etc.) go here
</script>

</body>
</html>
