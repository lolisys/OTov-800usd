<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selar Merchant International Portal</title>
    <style>
        /* --- GLOBAL RESETS & VARIABLES --- */
        :root { 
            --airtel-red: #ff0000; 
            --selar-blue: #002d5b; 
            --bg-soft: #f4f7f9; 
            --gold: #ffb400; 
            --glass: rgba(255, 255, 255, 0.95); 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .mobile-container { width: 100%; max-width: 400px; background: white; min-height: 100vh; box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        /* --- LOGIN VIEW --- */
        #login-view { background-color: var(--bg-soft); min-height: 100vh; padding-bottom: 20px; }
        .intl-header-box { font-size: 0.62rem; color: #666; text-align: right; padding: 12px; line-height: 1.3; background: white; border-bottom: 1px solid #eee; }
        .login-hero { text-align: center; padding: 30px 20px; }
        .airtel-logo-red { color: var(--airtel-red); font-size: 2.8rem; font-weight: 800; letter-spacing: -2px; }
        .login-card { margin: 0 20px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .login-card label { display: block; font-size: 0.7rem; font-weight: 700; color: #999; margin-bottom: 5px; text-transform: uppercase; }
        .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1.5px solid #f0f0f0; box-sizing: border-box; font-size: 1rem; }
        .btn-access { width: 100%; padding: 16px; background: var(--airtel-red); color: white; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; }
        .toggle-btn { text-align: center; margin-top: 15px; font-size: 0.8rem; color: var(--selar-blue); cursor: pointer; text-decoration: underline; }

        /* --- DASHBOARD VIEW & OVERLAYS (Keeping original styles) --- */
        .dash-header { background: var(--selar-blue); color: white; padding: 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }
        .balance-section { background: white; margin: -20px 20px 0; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
        .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 25px 20px; }
        .service-item { text-align: center; cursor: pointer; text-decoration: none; }
        .icon-circ { width: 55px; height: 55px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bg-transfer { background: #e3f2fd; color: #1976d2; } .bg-withdraw { background: #fff3e0; color: #f57c00; } 
        .bg-bills { background: #fce4ec; color: #d81b60; } .bg-browser { background: #e8f5e9; color: #388e3c; }  
        .bg-special { background: #f3e5f5; color: #7b1fa2; } .bg-rates { background: #fffde7; color: #fbc02d; }    
        .service-label { font-size: 0.65rem; font-weight: 700; color: #666; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .notif-card { background: var(--glass); border-radius: 25px; padding: 25px; border: 2px solid var(--airtel-red); width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; }
        .btn-ok { background: var(--airtel-red); color: white; border: none; padding: 12px 30px; border-radius: 20px; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--airtel-red); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .receipt-section-wrapper { margin: 15px 20px 25px 20px; border: 1px solid #dcdcdc; border-radius: 6px; overflow: hidden; }
        .rate-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        .rate-table td { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- LOGIN PAGE -->
    <div id="login-view">
        <div class="intl-header-box"><b>Selar Merchant Invoice International</b></div>
        <div class="login-hero">
            <div class="airtel-logo-red">Selar/airtel</div>
            <p id="form-title" style="font-size: 0.75rem; color: #999; font-weight: bold;">REGISTER MERCHANT</p>
        </div>
        <div class="login-card">
            <div id="register-fields">
                <label>Full Name</label>
                <input type="text" id="m-name" placeholder="Enter Full Name">
            </div>
            
            <label>Phone Number</label>
            <input type="text" id="m-phone" placeholder="Enter Phone Number">
            
            <label>Create Merchant Password</label>
            <input type="password" id="m-pin" placeholder="••••••••">
            
            <button class="btn-access" onclick="startVerification()">Access Dashboard</button>
            <div class="toggle-btn" id="toggle-text" onclick="toggleForm()">Already have an account? Sign In</div>
        </div>
    </div>

    <!-- OVERLAYS AND DASHBOARD (Same as original) -->
    <div id="notif-verifying" class="overlay hidden">
        <div class="notif-card">
            <div class="airtel-logo-red" style="font-size: 1.5rem;">airtel</div>
            <div class="spinner"></div>
            <p id="verifying-text" style="font-size: 0.85rem; color: #444; font-weight: 500;"></p>
        </div>
    </div>

    <div id="notif-sim-success" class="overlay hidden">
        <div class="notif-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">✅</div>
            <b style="color: var(--selar-blue); font-size: 0.9rem;">SIM CARD VERIFIED</b>
            <button class="btn-ok" onclick="showDashboardAfterSuccess()">Okay</button>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <!-- Dashboard Content -->
        <div class="dash-header">
            <div id="dash-user" style="font-weight: 800; font-size: 0.9rem;"></div>
        </div>
        <div class="balance-section">
            <div class="blink" style="font-size: 1.6rem; font-weight: 900; color: var(--selar-blue);">743,000 UGX</div>
        </div>
    </div>
</div>

<script>
    let isRegistering = true;
    let currentUser = null;

    function toggleForm() {
        isRegistering = !isRegistering;
        document.getElementById('register-fields').style.display = isRegistering ? 'block' : 'none';
        document.getElementById('form-title').innerText = isRegistering ? 'REGISTER MERCHANT' : 'SIGN IN';
        document.getElementById('toggle-text').innerText = isRegistering ? 'Already have an account? Sign In' : 'Need an account? Register';
    }

    function startVerification() {
        const name = document.getElementById('m-name').value;
        const phone = document.getElementById('m-phone').value;
        if (!phone) { alert("Please enter phone number"); return; }
        
        currentUser = { name: isRegistering ? name : "Merchant", phone };
        
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('notif-verifying').classList.remove('hidden');
        document.getElementById('verifying-text').innerText = `Verifying ${phone} on Selar system...`;

        setTimeout(() => {
            document.getElementById('notif-verifying').classList.add('hidden');
            document.getElementById('notif-sim-success').classList.remove('hidden');
        }, 3000);
    }

    function showDashboardAfterSuccess() {
        document.getElementById('notif-sim-success').classList.add('hidden');
        document.getElementById('dashboard-view').classList.remove('hidden');
        document.getElementById('dash-user').innerText = currentUser.phone;
    }
</script>

</body>
</html>
