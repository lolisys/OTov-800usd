<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Wallet Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Container mimicking the two screens */
        .app-container { display: flex; gap: 40px; }
        .screen { width: 350px; height: 650px; background: white; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); position: relative; overflow: hidden; padding: 40px; }

        /* Left Screen - Blue Theme */
        .screen-blue { background: #2b70c3; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .logo { font-size: 60px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 40px; }
        .btn-blue { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid white; background: transparent; color: white; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-white { background: white; color: #2b70c3; border: none; }

        /* Right Screen - Login Theme */
        .screen-white { display: flex; flex-direction: column; }
        .logo-small { color: #2b70c3; font-size: 40px; text-align: center; margin-bottom: 40px; }
        label { font-size: 12px; color: #888; display: block; margin-bottom: 8px; }
        input { width: 100%; border: none; border-bottom: 1px solid #ddd; padding: 10px 0; margin-bottom: 25px; font-size: 16px; outline: none; }
        .forgot { font-size: 12px; color: #2b70c3; text-align: right; display: block; margin-top: -20px; margin-bottom: 20px; cursor: pointer; }
        .btn-signin { width: 100%; padding: 15px; background: #2b70c3; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .register-link { text-align: center; font-size: 12px; color: #888; margin-top: auto; }
        .register-link a { color: #2b70c3; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="screen screen-blue">
        <div class="logo">▲</div>
        <div class="title">E-Wallet</div>
        <div class="subtitle">Manage all your cards easily in one place</div>
        <button class="btn-blue">Register</button>
        <button class="btn-blue btn-white">Sign in</button>
    </div>

    <div class="screen screen-white">
        <div class="logo-small">▲</div>
        
        <label>User name</label>
        <input type="text" value="Alena Turkina">
        
        <label>Password</label>
        <input type="password" value="••••••••">
        <span class="forgot">Forgot password?</span>
        
        <button class="btn-signin">Sign In</button>
        
        <div class="register-link">
            Don't have an account? <a href="#">Register</a>
        </div>
    </div>
</div>

</body>
</html>
